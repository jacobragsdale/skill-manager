[package]
name = "skill-manager"
version = "0.1.0"
description = "A small desktop app for installing and removing agent skills"
authors = ["Jacob Ragsdale"]
edition = "2021"
default-run = "skill-manager"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "skill_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2"
sha2 = "0.11"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-single-instance = "2.4.3"
tokio = { version = "1", features = ["time"] }
serde_yaml_ng = "0.10"

[dev-dependencies]
tempfile = "3"

# Skill Manager spends its time hashing skill directories, so the release build
# is tuned for throughput and a small installer. `panic` is deliberately left
# unwinding: catalog work runs on blocking worker threads, and a panic there
# has to surface as an error rather than take the whole application down.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
